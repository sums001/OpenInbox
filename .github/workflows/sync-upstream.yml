# Updates a copy created by the Deploy to Cloudflare button to a newer version of the original
# project. It only runs when you start it from the Actions tab: updates are never automatic, so a
# bad upstream release can't reach your inbox without you choosing to install it. It copies the
# upstream files into this repository, keeping your wrangler.jsonc names and database_id, and
# pushes a commit; Cloudflare then redeploys and the Worker applies any new database migrations.
name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch or tag to update to (default: latest release, else main)'
        required: false

permissions:
  contents: write

env:
  # The original OpenInbox repository. Keep in sync with UPSTREAM_REPO in src/shared/constants.ts.
  UPSTREAM: sums001/OpenInbox

jobs:
  sync:
    if: github.repository != 'sums001/OpenInbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copy upstream files
        run: node scripts/sync-upstream.mjs "${{ inputs.ref }}"
      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Already up to date."; exit 0; fi
          git config user.name "openinbox-sync[bot]"
          git config user.email "openinbox-sync@users.noreply.github.com"
          git add -A
          git commit -m "Update OpenInbox to $(cat .upstream-version 2>/dev/null || echo latest)"
          git push
